name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v6

      - name: Get Java version
        id: gradle-properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: org.gradle.java.version

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.gradle-properties.outputs.org-gradle-java-version }}

      - name: Build artifacts
        run: CI_RELEASE=1 ./gradlew clean build --no-daemon

      - name: Get versions
        id: versions
        run: echo "versions=$(find versions -mindepth 4 -maxdepth 4 -name '*.jar' | cut -d / -f2 | jq -R | jq -cs unique)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: versions/*/build/libs/!(*-@(dev|shadow)).jar

  publish:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        version: ${{ fromJSON(needs.build.outputs.versions) }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Publish build artifacts
        uses: Kira-NT/mc-publish@v3
        with:
          name: ""
          files: |
            ${{ matrix.version }}/build/libs/!(*-@(dev|shadow|sources|javadoc)).jar
            ${{ matrix.version }}/build/libs/*-@(sources|javadoc).jar
          github-token: ${{ secrets.GITHUB_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
