name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule: [cron: 4 5 1 * *]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Get Java version
        id: gradle-properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: org.gradle.java.version

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.gradle-properties.outputs.org-gradle-java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Loom Cache
        uses: actions/cache@v6
        env:
          MAPPINGS_CACHE_KEY: ${{ hashFiles('mappings/*', '*.gradle*') }}
          VERSIONS_CACHE_KEY: ${{ hashFiles('gradle.properties', 'stonecutter.properties.toml') }}
        with:
          path: .gradle/loom-cache
          key: loom-${{ env.MAPPINGS_CACHE_KEY }}-${{ env.VERSIONS_CACHE_KEY }}
          restore-keys: loom-${{ env.MAPPINGS_CACHE_KEY }}-

      - name: Build artifacts
        run: ./gradlew clean build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: versions/*/build/libs/*.jar
